name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app/backend

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: redid
          POSTGRES_USER: redid
          POSTGRES_PASSWORD: redid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redid -d redid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://redid:redid@localhost:5432/redid
      AUTH__JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
      AUTH__JWT_ALGORITHM: HS256
      AUTH__ACCESS_TOKEN_TTL_MINUTES: 15
      AUTH__REFRESH_TOKEN_TTL_DAYS: 30
      AUTH__STATE_SECRET: ci-state-secret-with-at-least-thirty-two-characters
      AUTH__STATE_TTL_MINUTES: 10
      YANDEX_OAUTH__CLIENT_ID: ci-client-id
      YANDEX_OAUTH__CLIENT_SECRET: ci-client-secret
      YANDEX_OAUTH__REDIRECT_URI: http://localhost/oauth/callback
      YANDEX_OAUTH__AUTHORIZE_URL: https://oauth.example/authorize
      YANDEX_OAUTH__TOKEN_URL: https://oauth.example/token
      YANDEX_OAUTH__USER_INFO_URL: https://oauth.example/userinfo

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/backend/pyproject.toml
            app/backend/poetry.lock

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Run linter
        run: ruff check .

      - name: Run type checking
        run: mypy

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests with coverage
        run: pytest --junitxml=test-results.xml --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Generate coverage badge and job summary
        run: >-
          python scripts/generate_coverage_badge.py
          coverage.xml
          coverage.svg
          --junit-xml test-results.xml
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: ${{ always() && hashFiles('app/backend/coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            app/backend/coverage.xml
            app/backend/coverage.svg
          retention-days: 14

  publish-badge:
    name: Publish coverage badge
    needs: backend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'Kasarch/red-id'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage badge
        uses: actions/download-artifact@v5
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/backend-coverage

      - name: Publish badge branch
        working-directory: .
        env:
          BADGE_SOURCE: ${{ runner.temp }}/backend-coverage/coverage.svg
          BADGE_WORKTREE: ${{ runner.temp }}/badges-worktree
        run: |
          set -euo pipefail
          test -s "$BADGE_SOURCE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin badges; then
            git worktree add --detach "$BADGE_WORKTREE" origin/badges
          else
            git worktree add --detach "$BADGE_WORKTREE"
            git -C "$BADGE_WORKTREE" switch --orphan badges
            git -C "$BADGE_WORKTREE" rm -rf .
          fi

          cp "$BADGE_SOURCE" "$BADGE_WORKTREE/coverage.svg"
          git -C "$BADGE_WORKTREE" add coverage.svg
          if git -C "$BADGE_WORKTREE" diff --cached --quiet; then
            exit 0
          fi
          git -C "$BADGE_WORKTREE" commit -m "Update coverage badge"
          git -C "$BADGE_WORKTREE" push origin HEAD:badges
