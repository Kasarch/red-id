[project]
name = "redid-backend"
version = "0.1.0"
description = "Backend for the redid web application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.128,<1",
    "httpx>=0.28,<1",
    "pyjwt>=2.13,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "venv",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C4",
    "C90",
    "B",
    "N",
    "SIM",
    "T20",
    "UP",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "C901",
]
fixable = ["I", "RUF022", "RUF023", "F401", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "auth",
    "characters",
    "config",
    "database",
    "main",
    "migrations",
    "skills",
    "tests",
    "users",
]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
no-lines-before = []

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["cached_classproperty", "classproperty"]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]
files = ["src", "tests", "migrations/env.py"]
plugins = ["pydantic.mypy"]
exclude = [
    "venv",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".*\\.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
